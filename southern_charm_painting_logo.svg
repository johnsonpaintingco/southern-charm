<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <style>
      .navy { fill:#17283A; }
      .blue { fill:#8FA7B5; }
      .gold { fill:#C5B99E; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .script { font-family: "Brush Script MT", "Segoe Script", cursive; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Transparent background -->

  <!-- SC monogram -->
  <g transform="translate(600 80)">
    <!-- Stylized S -->
    <path class="navy" d="
      M -185 225
      C -250 185,-235 65,-105 48
      C -20 37,55 61,92 94
      L 78 155
      C 25 111,-32 96,-89 105
      C -143 114,-157 151,-119 174
      C -82 196,-8 208,43 242
      C 101 280,95 355,45 397
      C -12 446,-116 438,-181 392
      L -158 335
      C -99 370,-38 378,-3 354
      C 23 337,12 313,-22 294
      C -60 273,-132 258,-185 225 Z"/>

    <!-- Stylized C -->
    <path class="blue" fill-rule="evenodd" d="
      M 245 112
      C 186 63,91 52,35 88
      C -21 124,-35 197,-3 260
      C 27 319,98 347,168 327
      C 217 313,259 277,284 236
      L 319 264
      C 282 331,221 382,143 394
      C 39 410,-50 366,-92 288
      C -135 208,-114 116,-43 61
      C 31 3,144 8,229 55
      C 258 71,278 87,292 99
      Z
      M 222 135
      C 170 101,104 95,63 119
      C 19 145,5 202,29 245
      C 54 291,108 311,160 296
      C 198 285,226 259,248 226
      L 209 205
      C 190 234,167 252,137 257
      C 101 263,68 245,55 215
      C 41 181,53 146,83 129
      C 112 112,157 117,198 143
      Z"/>

    <!-- Paint brush through monogram -->
    <g transform="translate(5 170)">
      <rect x="-25" y="0" width="50" height="245" rx="8" class="navy"/>
      <circle cx="0" cy="-13" r="13" fill="none" stroke="#17283A" stroke-width="8"/>
      <rect x="-34" y="92" width="68" height="19" class="navy"/>
      <path class="gold" d="M -25 111 H 25 V 188
        C 20 211,12 226,0 242
        C -12 226,-20 211,-25 188 Z"/>
      <path fill="#FFFFFF" d="M -17 116 H -8 V 198 C -10 209,-12 216,-17 223 Z"/>
      <path fill="#FFFFFF" d="M -3 116 H 5 V 211 C 3 220,2 226,0 232 Z"/>
      <path fill="#FFFFFF" d="M 11 116 H 19 V 200 C 17 210,15 217,11 224 Z"/>
      <!-- blue paint stroke -->
      <path class="blue" d="M -22 205 C -5 245,31 263,76 264
        C 31 277,-12 261,-31 231 Z"/>
    </g>
  </g>

  <!-- SOUTHERN -->
  <text x="600" y="690" text-anchor="middle" class="navy serif"
        font-size="103" letter-spacing="17">SOUTHERN</text>

  <!-- decorative lines -->
  <line x1="185" y1="770" x2="350" y2="770" stroke="#8FA7B5" stroke-width="5"/>
  <line x1="850" y1="770" x2="1015" y2="770" stroke="#8FA7B5" stroke-width="5"/>

  <!-- Charm -->
  <text x="600" y="830" text-anchor="middle" class="blue script"
        font-size="122" font-style="italic">Charm</text>

  <!-- PAINTING -->
  <circle cx="405" cy="902" r="7" class="blue"/>
  <circle cx="795" cy="902" r="7" class="blue"/>
  <text x="600" y="920" text-anchor="middle" class="blue sans"
        font-size="38" font-weight="600" letter-spacing="15">PAINTING</text>
</svg>